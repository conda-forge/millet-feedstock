context:
  version: "0.15.3"

package:
  name: millet
  version: ${{ version }}

source:
  url: https://github.com/azdavis/millet/archive/v${{ version }}.tar.gz
  sha256: f974a7dacd0e163bd10ebdbc798ec249a89efd01905e8e57b32d2f017254cedf

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - millet-cli --help

about:
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE.md
    - LICENSE-MIT.md
    - THIRDPARTY.yml
  summary: A language server for Standard ML in Rust.
  homepage: https://github.com/azdavis/millet
  repository: https://github.com/azdavis/millet

extra:
  recipe-maintainers:
    - danielnachun
